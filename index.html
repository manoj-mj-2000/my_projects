<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Web App</title>
  <style>
    h1 {
      background-color: rgb(3, 63, 242);
      color: white;
      text-align: center;
    }
    body{
      background-color: aliceblue;
    }
    #textbox {
      margin-left: 8%;
      width: 80%;
      text-align: left;
      padding: 2%;
      border-radius: 35px;
    }
    #fetchData, #createTab {
      margin-top: 2%;
      margin-left: 47%;
      width: 150px;
      height: 50px;
      color: white;
      font-weight: bold;
      font-size: larger;
      background-color: rgb(3, 63, 242);
      border-radius: 10px;
    }
    #tableContainer{
      display: flex;
      width: 100%;
      flex-wrap: wrap;
    }
    #tableContainer > table{
      background-color: transparent;
      margin: 2% 4%;
      padding: 10px;
      font-size: 15px;
      border: solid;
    }
    #tableContainer button{
      background: transparent;
      font-style: italic;
      color: white;
      border: none;
      background-color: #4286ea;
    }
    tr{
      height: 0px;
    }
    th, td{
      padding: 5px;
    border-bottom: 1px solid;
    border-right: 1px solid;
    }
    th{
      background-color: red;
      color: white;
    }
    #createTab{
      display: none;
      margin-left: 5%;
    }
  </style>
</head>
<body>
  <h1>Assignment</h1>
  <textarea id="textbox" name="json" rows="25" cols="50"></textarea><br>
  <button id="fetchData">Sent JSON</button>
  <button id="createTab">Create Table</button>
  <div id="tableContainer"></div>

  <script>
    document.getElementById('fetchData').addEventListener('click', () => {
      const jsonInput = document.getElementById('textbox').value;

      fetch('/json/data', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: jsonInput
      })
      .then(response => response.json())
      .then(data => {
        if(data.status === 'success'){
          getTableInfo();
        } else {
          alert("Given json have issues");
        }
      })
      .catch(error => {
        console.error('Error sending data:', error);
      });
    });

    async function getTableInfo(){
      var millisecondsToWait = 1000;
      setTimeout(function() {
        fetch('json/load', {
          method: 'GET'
        })
        .then(response => response.json())
        .then(data => {
          if(data !== null){
            loadTables(data);
          }
        });
      }, millisecondsToWait);
    }

    function loadTables(data){
      var txt = document.getElementById('textbox');
      txt.style.display = 'none';
      var btn = document.getElementById('fetchData');
      btn.style.display = 'none';
      var cbtn = document.getElementById('createTab');
      cbtn.style.display = 'block';
      var json = data.data;
      console.log(json);

      var keys = Object.keys(json);
      keys.forEach(key =>{
        console.log(key);
        console.log(JSON.stringify(json[key]));
        processTableMeta(key, json[key]);
      }); 
    }

    function processTableMeta(tableName, columnArray){
      var table = document.createElement('table');
      table.setAttribute('id', tableName);
      var headerRow = document.createElement('tr');
      var thRow = document.createElement('th');
      thRow.textContent = tableName.toUpperCase();
      headerRow.appendChild(thRow);
      var empty = document.createElement('th');
      headerRow.appendChild(empty);
      var addCell = document.createElement('th');
      addCell.setAttribute('id',"rename");
      addCell.innerHTML = "<button name="+tableName+" id=\"renameTab\">Rename</button>";
      headerRow.appendChild(addCell);
      table.appendChild(headerRow);
      

      columnArray.forEach(item => {
        var row = document.createElement('tr');
        for (let key in item) {
          var cell = document.createElement('td');
          if(key === 'data_type' && item[key] === 'character varying'){
            cell.textContent ='varchar';
          } else {
            cell.textContent = item[key];
          }
          row.appendChild(cell);
        }
        var editCell = document.createElement('td');
        editCell.innerHTML = "<button name="+tableName+" id=\"editColumn\">Edit</button>";
        row.appendChild(editCell);
        table.appendChild(row);
      });
      var newTr = document.createElement('tr');
      var addCell = document.createElement('td');
      addCell.setAttribute('id',"addColumn");
      addCell.innerHTML = "<button name="+tableName+" id=\"addColumn\">Add Column</button>";
      newTr.appendChild(addCell);
      table.appendChild(newTr);

      var tableContainer = document.getElementById('tableContainer');
      tableContainer.appendChild(table);
    }
    const buttonContainer = document.getElementById('tableContainer');
    buttonContainer.addEventListener('click', function(event) {
      if (event.target.tagName === 'BUTTON') {
        const table = event.target.closest('table');
        const tableId = table.getAttribute('id');
        const name = event.target.getAttribute('name');
        const action = event.target.getAttribute('id');
        console.log(`Button clicked with action:`, action);
        if(action === 'addColumn'){
          var newColName = prompt("Enter the New Column Name:");
          var dataType = prompt("Enter the data type:");
          var json = { colName: newColName, dataType: dataType, table: tableId};
          console.log(json);
          if(newColName !== null && newColName !== '' && dataType !== null && dataType !== ''){
            fetch('/json/addColumn',{
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(json)
            })
            .then(response => response.json())
            .then(data => {
              if(data.result === 'success'){
                alert("Column Inserted");
                var rows = table.querySelectorAll('tr');
                var lastTr = rows[rows.length - 1];
                lastTr.innerHTML = "<td>"+newColName+"</td><td>"+dataType+"</td>";
                var editCell = document.createElement('td');
                editCell.innerHTML = "<button name="+tableId+" id=\"editColumn\">Edit</button>";
                lastTr.appendChild(editCell);

                var newTr = document.createElement('tr');
                var addCell = document.createElement('td');
                addCell.setAttribute('id',"addColumn");
                addCell.innerHTML = "<button name="+tableId+" id=\"addColumn\">Add Column</button>";
                newTr.appendChild(addCell);
                table.appendChild(newTr);
              } else {
                alert("Invalid values");
              }
            })
            .catch(error => {
              console.error('Error sending data:', error);
            });
          }
        }
        if(action === 'renameTab'){
          var newTab = prompt("Enter the Name: ");
          var json = { newName: newTab, table: tableId};
          console.log(json);
          fetch('/json/rename',{
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(json)
            })
            .then(response => response.json())
            .then(data => {
              if(data.result === 'success'){
                table.setAttribute('id', newTab);
                var rows = table.querySelectorAll('tr');
                var firstTr = rows[0];
                firstTr.innerHTML = "<th>"+newTab.toUpperCase()+"</th><th></th><th><button name="+tableId+" id=\"renameTab\">Rename</button></th>";
              } else {
                alert("Invalid values");
              }
            })
            .catch(error => {
              console.error('Error sending data:', error);
            });
        }
        if(action === 'editColumn') {
          var newColName = prompt("Enter the Column Name:");
          var dataType = prompt("Enter the data type:");
          var fTr = event.target.closest('tr');
          var oldCName = fTr.children[0].textContent;
          var oldDt = fTr.children[1].textContent;
          console.log(oldCName);
          var json = { colName: newColName, dataType: dataType, table: tableId, oldName: oldCName, oldType: oldDt};
          console.log(json);
          if(newColName !== null && newColName !== '' && dataType !== null && dataType !== ''){
            fetch('/json/editColumn',{
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(json)
            })
            .then(response => response.json())
            .then(data =>{
              if(data.result === 'success'){
                alert("Column Edited");
                fTr.children[0].textContent = newColName;
                fTr.children[1].textContent = dataType;
              } else {
                alert("Invalid values");
              }
            })
            .catch(error => {
              console.error('Error sending data:', error);
            });
          }
        }
      } 
    });
    
    document.getElementById('createTab').addEventListener('click', () => {
      var tableName = prompt("Enter name for New Table: ");
      if(tableName !== null && tableName !== '' ){
        var json = { name: tableName};
        fetch('/json/createTable',{
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(json)
        })
        .then(response => response.json())
        .then(data =>{
          if(data.result === 'success'){
            alert("Table Created");
            var table = document.createElement('table');
            var tableContainer = document.getElementById('tableContainer');

            table.setAttribute('id', tableName);
            var headerRow = document.createElement('tr');
            var thRow = document.createElement('th');
            thRow.textContent = tableName.toUpperCase();
            headerRow.appendChild(thRow);
            var empty = document.createElement('th');
            headerRow.appendChild(empty);

            var addCell = document.createElement('th');
            addCell.setAttribute('id',"rename");
            addCell.innerHTML = "<button name="+tableName+" id=\"renameTab\">Rename</button>";
            headerRow.appendChild(addCell);
            table.appendChild(headerRow);

            var newTr = document.createElement('tr');
            var addCell = document.createElement('td');
            addCell.setAttribute('id',"addColumn");
            addCell.innerHTML = "<button name="+tableName+" id=\"addColumn\">Add Column</button>";
            newTr.appendChild(addCell);

            table.appendChild(newTr);
            tableContainer.appendChild(table);
          } else {
            alert("Invalid value");
          }
        })
        .catch(error => {
          console.error('Error sending data:', error);
        });
      } else{
        alert("Invalid value");
      }
    });


  </script>
</body>
</html>
